<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NOC_Beam</title>
<style>
  :root {
    --bg: #14161d;
    --panel: #1b1e28;
    --raised: #232734;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.13);
    --text: #e8ebf4;
    --text-2: #9aa3b8;
    --text-3: #5f6880;
    --accent: #6673e8;
    --accent-2: #8b5cf6;
    --ok: #34d399;
    --bad: #f0656d;
    --warn: #f5b04d;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  /* The [hidden] attribute must always win, even over elements that set an
     explicit display (.controls/.supplier-row use display:flex, which would
     otherwise override the UA [hidden]{display:none} and leak the incoming
     Answer/Reject row onto outgoing calls). */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
  }

  .chrome {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px 10px 14px;
  }
  .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; font-size: 12px; color: #fff; flex: 0 0 auto;
  }
  .wordmark { font-weight: 600; font-size: 13px; letter-spacing: .2px; flex: 0 0 auto; }
  .account {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; cursor: pointer;
    transition: border-color .15s;
    max-width: 170px; min-width: 0;
  }
  .account:hover { border-color: var(--border-strong); }
  .account .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 8px var(--ok); flex: 0 0 auto; }
  .dot.ok     { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
  .dot.warn   { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.danger { background: var(--bad);  box-shadow: 0 0 8px var(--bad); }
  .dot.muted  { background: var(--text-3); box-shadow: none; }
  .caret { color: var(--text-3); font-size: 10px; flex: 0 0 auto; }
  .winbtns { display: flex; flex: 0 0 auto; }
  .winbtn, .hamburger {
    width: 34px; height: 26px; border: 0; background: transparent;
    color: var(--text-3); font-size: 12px; border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .hamburger { width: 30px; font-size: 16px; line-height: 1; }
  .winbtn:hover, .hamburger:hover { background: var(--raised); color: var(--text); }
  .winbtn.close:hover { background: var(--bad); color: #fff; }

  .body { padding: 4px 16px 16px; display: flex; flex-direction: column;
          gap: 12px; height: calc(100% - 46px); }

  .omni { display: flex; gap: 8px; }
  .omni input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 11px 14px;
    font-family: var(--mono); font-size: 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .omni input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(102,115,232,.18);
  }
  .omni input::placeholder { color: var(--text-3); }
  .call-btn {
    border: 0; border-radius: 10px; padding: 0 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    transition: filter .15s, transform .08s;
  }
  .call-btn:hover { filter: brightness(1.12); }
  .call-btn:active { transform: scale(.97); }
  .call-btn:disabled { opacity: .4; cursor: default; }

  /* Supplier route selector (shown only for teles/genband accounts). */
  .supplier-row { display: flex; align-items: center; gap: 8px; margin-top: -4px; }
  .supplier-row .k { font-size: 11.5px; color: var(--text-3); flex: 0 0 auto; }
  .supplier-sel {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    transition: border-color .15s;
  }
  .supplier-sel:hover { border-color: var(--border-strong); }
  .supplier-sel .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis;
                       white-space: nowrap; color: var(--text-2);
                       font-family: var(--mono); }

  /* Live-call stack: one card per active call (phase-2 multi-call). */
  .calls { display: flex; flex-direction: column; gap: 8px; }
  .live {
    background: linear-gradient(160deg, rgba(102,115,232,.10), rgba(139,92,246,.05)),
                var(--panel);
    border: 1px solid rgba(102,115,232,.25);
    border-radius: 14px; padding: 14px 16px;
    animation: rise .25s ease-out;
  }
  /* Stacked (2+) cards compact themselves; the selected (audio-focus) card
     carries a stronger border, mirroring the Qt calls_strip selection. */
  .live.compact { padding: 10px 12px; border-radius: 12px; }
  .live.compact .num { font-size: 15px; }
  .live.compact .controls { margin-top: 8px; }
  .live.sel { border-color: rgba(102,115,232,.6); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .live .top { display: flex; align-items: center; gap: 10px; }
  .live .num { font-family: var(--mono); font-size: 19px; font-weight: 600;
               letter-spacing: .5px; flex: 1; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    background: rgba(102,115,232,.13); color: var(--accent);
  }
  .chip.ring { background: rgba(245,176,77,.13); color: var(--warn);
               animation: breathe 1.6s ease-in-out infinite; }
  .chip.ok   { background: rgba(52,211,153,.13); color: var(--ok); }
  .chip.bad  { background: rgba(240,101,109,.13); color: var(--bad); }
  .chip.hold { background: rgba(245,176,77,.13); color: var(--warn); }
  .chip.prog { background: rgba(102,115,232,.13); color: var(--accent); }
  @keyframes breathe { 50% { opacity: .55; } }
  .chip .t { font-family: var(--mono); font-weight: 400; }
  .via { color: var(--text-3); font-size: 11.5px; margin-top: 3px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .controls { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
  .ctl {
    width: 38px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--raised);
    color: var(--text-2); cursor: pointer; font-size: 14px;
    transition: all .13s;
  }
  .ctl:hover { color: var(--text); border-color: var(--border-strong);
               transform: translateY(-1px); }
  .ctl.on { background: rgba(102,115,232,.2); border-color: var(--accent);
            color: var(--text); }
  .end {
    margin-left: auto; border: 0; border-radius: 8px; padding: 8px 18px;
    background: var(--bad); color: #fff; font-weight: 600; font-size: 12.5px;
    cursor: pointer; transition: filter .15s;
  }
  .end:hover { filter: brightness(1.15); }
  /* Incoming: Answer/Reject wide buttons. */
  .controls.incoming { gap: 10px; }
  .btn-answer, .btn-reject {
    flex: 1; border: 0; border-radius: 8px; padding: 9px 0;
    font-weight: 600; font-size: 12.5px; cursor: pointer; color: #fff;
    transition: filter .15s;
  }
  .btn-answer { background: var(--ok); }
  .btn-reject { background: var(--bad); }
  .btn-answer:hover, .btn-reject:hover { filter: brightness(1.12); }

  /* Compact per-call DTMF pad (phase-2 multi-call): toggled by the ⌗
     button on each card; 6x2 grid keeps two open cards inside 560px. */
  .minipad {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    margin-top: 8px;
  }
  .minipad .mkey {
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 0; text-align: center; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--text-2);
    transition: all .12s;
  }
  .minipad .mkey:hover { color: var(--text); border-color: var(--border-strong); }
  .minipad .mkey:active { transform: scale(.94); background: rgba(102,115,232,.2);
                          border-color: var(--accent); }

  /* RX/TX live-audio meters (owner feedback 2026-07-16.4): vertical bars
     flanking the numpad -- RX left, TX right -- metering the audio-focused
     call. Real levels pushed from PhoneShell's AudioStrip poll via
     nb.levels() at ~6 Hz while a call is active; zero pushes when idle.
     Fills grow bottom-up. The whole pad-row (pad + meters) hides together
     when 2+ calls are active, same as the pad did. */
  .pad-row { display: flex; gap: 8px; align-items: stretch; }
  .pad-row .pad { flex: 1; min-width: 0; }
  .vmeter { display: flex; flex-direction: column; align-items: center;
            gap: 4px; width: 16px; flex: 0 0 auto; }
  .vmeter .ml { font-size: 8.5px; font-weight: 700; letter-spacing: .5px;
                color: var(--text-3); }
  .vmeter .vtrack { flex: 1; width: 4px; border-radius: 2px;
                    background: var(--raised); overflow: hidden;
                    display: flex; flex-direction: column;
                    justify-content: flex-end; }
  .vmeter .vfill { width: 100%; height: var(--lvl, 0%); border-radius: 2px;
                   transition: height .12s linear, width .12s linear; }
  .vmeter.rx .vfill { background: var(--ok); }
  .vmeter.tx .vfill { background: var(--accent); }
  /* Multi-call (owner round 5): the PAD hides but the meters stay -- the
     row collapses into a slim horizontal strip: RX bar left, TX bar right. */
  .pad-row.compact { gap: 12px; }
  .pad-row.compact .pad { display: none; }
  .pad-row.compact .vmeter { flex: 1; flex-direction: row; width: auto;
                             gap: 6px; align-items: center; }
  .pad-row.compact .vtrack { flex: 1; width: auto; height: 4px;
                             flex-direction: row; justify-content: flex-start; }
  .pad-row.compact .vfill { height: 100%; width: var(--lvl, 0%); }

  /* Phase-2 owner feedback: tighter keypad (~31px keys) so the default
     window drops to 360x560 and recents gain the freed space. */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; padding: 4px 0 3px; text-align: center; cursor: pointer;
    transition: all .12s;
  }
  .key:hover { background: var(--raised); border-color: var(--border-strong);
               transform: translateY(-1px); }
  .key:active { transform: scale(.96); background: rgba(102,115,232,.15);
                border-color: var(--accent); }
  .key .d { font-size: 14px; font-weight: 500; line-height: 1.15; }
  .key .c { font-size: 7.5px; letter-spacing: 1.2px; color: var(--text-3);
            height: 8px; line-height: 8px; }

  .sect { display: flex; align-items: baseline; margin-top: 2px; }
  .sect h2 { font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
             text-transform: uppercase; color: var(--text-3); flex: 1; }
  .sect a { color: var(--accent); font-size: 12px; text-decoration: none; cursor: pointer; }

  .recents { flex: 1; overflow-y: auto; display: flex;
             flex-direction: column; gap: 4px; margin: 0 -6px; padding: 0 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    transition: background .12s;
  }
  .row:hover { background: var(--panel); }
  .row:hover .redial { opacity: 1; }
  .arrow { font-size: 12px; flex: 0 0 auto; }
  .arrow.ok { color: var(--ok); } .arrow.bad { color: var(--bad); }
  .row .n { font-family: var(--mono); font-size: 13px; flex: 1;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 2.5px 9px;
           border-radius: 20px; flex: 0 0 auto; }
  .badge.ok  { background: rgba(52,211,153,.12); color: var(--ok); }
  .badge.bad { background: rgba(240,101,109,.12); color: var(--bad); }
  .row .w { font-family: var(--mono); font-size: 11px; color: var(--text-3); flex: 0 0 auto; }
  .redial { opacity: 0; transition: opacity .15s; background: none;
            border: 0; color: var(--accent); cursor: pointer; font-size: 13px; flex: 0 0 auto; }
  .empty { color: var(--text-3); font-size: 12px; text-align: center; padding: 20px 0; }

  /* Pop-over menus (account switcher, hamburger, supplier).
     Phase-2 fix: long lists (supplier catalogs) must SCROLL, not clip
     below the window edge -- max-height set per-open by positionMenu(),
     overflow-y here; wheel + ArrowUp/Down/Enter/Escape handled in JS. */
  .menu {
    position: fixed; z-index: 40; min-width: 168px;
    background: var(--raised); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    animation: pop .12s ease-out;
    overflow-y: auto; overscroll-behavior: contain; outline: none;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .menu[hidden] { display: none; }
  .menu .item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 7px; font-size: 12.5px;
    cursor: pointer; color: var(--text); white-space: nowrap;
  }
  .menu .item:hover, .menu .item.kbd { background: var(--panel); }
  .menu .item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .menu .item.active { color: var(--accent); }
  .menu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .menu .build-tag {
    padding: 4px 10px 2px; font-family: var(--mono); font-size: 9.5px;
    color: var(--text-3); user-select: text; cursor: default;
  }
  /* Type-to-search filter inside the account / supplier dropdowns (owner
     feedback 2026-07-16.3: the Qt combos had type-to-filter; catalogs are
     huge). Sticks to the top of the (scrollable) menu so it stays reachable
     while the filtered rows scroll under it. */
  .menu .menu-filter {
    position: sticky; top: 0; z-index: 1; box-sizing: border-box;
    width: 100%; margin: 0 0 5px; padding: 6px 9px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: 12px;
    font-family: inherit; outline: none;
  }
  .menu .menu-filter:focus { border-color: var(--accent);
                             box-shadow: 0 0 0 3px rgba(102,115,232,.18); }
  .menu .menu-filter::placeholder { color: var(--text-3); }
  /* Per-account edit gear on each account-dropdown row (owner feedback
     2026-07-16.3). Row click switches account; gear click edits THAT account
     (stopPropagation), never switching. */
  .menu .item .gear {
    flex: 0 0 auto; border: 0; background: transparent; cursor: pointer;
    color: var(--text-3); font-size: 12.5px; line-height: 1;
    padding: 2px 5px; border-radius: 5px;
    transition: color .12s, background .12s;
  }
  .menu .item .gear:hover { color: var(--text); background: var(--bg); }

  /* ===== Tabbed views (phase 2: History/Contacts/Favorites in-app) ===== */
  .view { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .tabbar {
    display: flex; gap: 4px; padding-top: 7px;
    border-top: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 6px 0 5px; border-radius: 8px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-3); cursor: pointer;
    transition: color .12s, background .12s;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--text); background: var(--raised); }

  .viewbar { display: flex; gap: 8px; }
  .search {
    min-width: 0; width: 100%; flex: 0 0 auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); padding: 8px 12px;
    font-size: 12.5px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  /* Inside the horizontal viewbar the search shares the row with a button. */
  .viewbar .search { flex: 1 1 auto; width: auto; }
  .search:focus { border-color: var(--accent);
                  box-shadow: 0 0 0 3px rgba(102,115,232,.18); }
  .search::placeholder { color: var(--text-3); }
  .mini-btn {
    border: 1px solid var(--border); background: var(--raised);
    color: var(--text-2); border-radius: 9px; padding: 0 14px;
    font-size: 12px; cursor: pointer; transition: all .13s;
  }
  .mini-btn:hover { color: var(--text); border-color: var(--border-strong); }

  .vlist { flex: 1; overflow-y: auto; display: flex; flex-direction: column;
           gap: 4px; margin: 0 -6px; padding: 0 6px; }

  /* History expandable detail panel */
  .hdetail {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px; margin: 0 4px 4px;
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
    font-size: 11px;
  }
  .hdetail .k { color: var(--text-3); }
  .hdetail .v { color: var(--text-2); font-family: var(--mono);
                user-select: text; overflow-wrap: anywhere; }

  /* Contact rows reuse .row; name + mono number stacked left */
  .row .cname { flex: 1; min-width: 0; }
  .row .cname .nm { font-weight: 600; font-size: 12.5px;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .cname .nr { font-family: var(--mono); font-size: 11px; color: var(--text-3);
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .grp { font-size: 10px; color: var(--text-3); border: 1px solid var(--border);
              border-radius: 20px; padding: 2px 8px; flex: 0 0 auto; }
  .row .star { color: var(--warn); font-size: 12px; flex: 0 0 auto; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 4px; }
</style>
</head>
<body>
  <div class="chrome" id="chrome">
    <div class="logo">N</div>
    <div class="wordmark" id="wordmark">NOC_Beam</div>
    <div class="account" id="account-pill">
      <span class="dot muted" id="account-dot"></span>
      <span class="lbl" id="account-label">No account</span>
      <span class="caret">▾</span>
    </div>
    <button class="hamburger" id="btn-menu" title="Menu">≡</button>
    <div class="winbtns">
      <button class="winbtn" id="btn-min" title="Minimize">–</button>
      <button class="winbtn close" id="btn-close" title="Close">✕</button>
    </div>
  </div>

  <div class="body">
    <!-- ===== Dial view ===== -->
    <div class="view" id="view-dial">
      <div class="omni">
        <input id="num" placeholder="Type a number, paste, or press / to focus" spellcheck="false">
        <button class="call-btn" id="btn-call">Call</button>
      </div>

      <div class="supplier-row" id="supplier-row" hidden>
        <span class="k">via</span>
        <div class="supplier-sel" id="supplier-sel">
          <span class="lbl" id="supplier-label">—</span>
          <span class="caret">▾</span>
        </div>
      </div>

      <!-- Live-call stack: one card per active call, built by app.js. -->
      <div class="calls" id="calls"></div>

      <div class="pad-row" id="pad-row">
        <div class="vmeter rx"><span class="ml">RX</span>
          <div class="vtrack"><div class="vfill" id="vfill-rx"></div></div>
        </div>
        <div class="pad" id="pad"></div>
        <div class="vmeter tx"><span class="ml">TX</span>
          <div class="vtrack"><div class="vfill" id="vfill-tx"></div></div>
        </div>
      </div>

      <div class="sect"><h2>Recent calls</h2><a id="view-all">View all</a></div>
      <div class="recents" id="recents"></div>
    </div>

    <!-- ===== History view (phase 2) ===== -->
    <div class="view" id="view-history" hidden>
      <input class="search" id="history-search" placeholder="Search number or status" spellcheck="false">
      <div class="vlist" id="history-list"></div>
    </div>

    <!-- ===== Contacts view (phase 2) ===== -->
    <div class="view" id="view-contacts" hidden>
      <div class="viewbar">
        <input class="search" id="contacts-search" placeholder="Search contacts" spellcheck="false">
        <button class="mini-btn" id="contacts-manage" title="Add / edit in the manager">Manage</button>
      </div>
      <div class="vlist" id="contacts-list"></div>
    </div>

    <!-- ===== Favorites view (phase 2) ===== -->
    <div class="view" id="view-favorites" hidden>
      <input class="search" id="favorites-search" placeholder="Search favorites" spellcheck="false">
      <div class="vlist" id="favorites-list"></div>
    </div>

    <!-- ===== Bottom tab bar ===== -->
    <div class="tabbar" id="tabbar">
      <div class="tab active" data-view="dial">Dial</div>
      <div class="tab" data-view="history">History</div>
      <div class="tab" data-view="contacts">Contacts</div>
      <div class="tab" data-view="favorites">Favorites</div>
    </div>
  </div>

  <!-- popover menus -->
  <div class="menu" id="account-menu" hidden></div>
  <div class="menu" id="app-menu" hidden></div>
  <div class="menu" id="supplier-menu" hidden></div>

  <script src="qwebchannel.js"></script>
  <script src="app.js"></script>
</body>
</html>
