# FAS model manifest / drop-in contract
#
# The FAS (False Answer Supervision) engine is an ensemble of three ONNX
# models. They live in:
#
#     python-app/src/noc_beam/audio/models/
#
# and are bundled by build/noc_beam.spec, which globs *.onnx and
# *.onnx.data from that directory. The models are .gitignored (large
# binaries), so they are NOT in the repo and must be present in that
# directory at build time. A build with a model missing still runs, but
# in DEGRADED mode (see noc_beam.audio.fas_engine._log_model_inventory,
# which logs "FAS DEGRADED MODE" at engine start).
#
# Format per entry:
#   filename       required role                                  status
#
# ---------------------------------------------------------------------------
# silero_vad.onnx        voice-activity detection                  PRESENT
#   - input : float32 PCM, 16 kHz mono
#   - source: Silero VAD (snakers4/silero-vad), ONNX export
#
# Cnn14_16k.onnx         audio-event classification (PANNs)        PRESENT
#   + Cnn14_16k.onnx.data  (external-weights sidecar, ~327 MB)
#   - input : float32 PCM, 16 kHz mono
#   - source: PANNs Cnn14 16 kHz, ONNX export with external data
#   - NOTE: the .onnx.data sidecar MUST sit next to the .onnx or the
#           InferenceSession fails. The spec globs *.onnx.data for this.
#
# aasist.onnx            anti-spoof / false-answer (PRIMARY)       PRESENT
#   - input : float32 PCM, 4.04 s @ 16 kHz = 64600 samples, shape (1, 64600)
#             (AASIST positional embeddings are FIXED to nb_samp=64600;
#              feeding any other length is rejected by onnxruntime)
#   - output: logits, shape (1, 2). softmax over 2 classes;
#             index 0 = spoof, index 1 = bonafide.
#             VERIFIED against clovaai main.py produce_evaluation_file:
#             `_, batch_out = model(x); score = batch_out[:, 1]` is the
#             bonafide / CM score -> idx 1 = bonafide. AasistDetector
#             returns softmax[0] (spoof prob) accordingly.
#   - role  : the model that actually decides "false answer / synthetic /
#             recorded audio". Without it the ensemble is VAD + event-
#             classification only and verdicts collapse to INCONCLUSIVE
#             (~0.15) regardless of captured audio. Flagged in
#             LOGIC_REVIEW_2026-05-25.md, confirmed in field logs 2026-06.
#   - source: clovaai/aasist (MIT), models/weights/AASIST.pth
#             checkpoint sha256:
#               51d2d9cf0738172f61e2a384ec50a54a55363240f67c971ed55a92435bc1a1c0
#             exported -> aasist.onnx (self-contained, weights inline) sha256:
#               03972ac4e5f714c0dfa340bbacff3ef407fa9643388dd2aedcce4fc8cac4d43e
#   - rebuild: python build/export_aasist_onnx.py   (downloads the MIT
#             checkpoint by pinned SHA, loads it with weights_only=True so
#             only tensors are read and no embedded code can run, then
#             exports + parity-checks the ONNX). torch is used ONLY by that
#             script, never bundled into the app.
#   - NOTE  : the ONNX export is verified faithful to the PyTorch model
#             (logit parity < 1e-3). It is NOT yet accuracy-validated on a
#             labelled ASVspoof eval set in-tree -- spoof scores are
#             sound in direction (noise/synthetic -> high spoof) but a
#             formal EER check against held-out data is still advisable.
# ---------------------------------------------------------------------------
#
# All three models load at FAS engine start; a missing one triggers the
# "FAS DEGRADED MODE" error log (audio/fas_engine._log_model_inventory)
# and the spec's "FAS DEGRADED BUILD" banner.
