<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NOC_Beam</title>
<style>
  :root {
    --bg: #14161d;
    --panel: #1b1e28;
    --raised: #232734;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.13);
    --text: #e8ebf4;
    --text-2: #9aa3b8;
    --text-3: #5f6880;
    --accent: #6673e8;
    --accent-2: #8b5cf6;
    --ok: #34d399;
    --bad: #f0656d;
    --warn: #f5b04d;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
  }

  .chrome {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px 10px 14px;
  }
  .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; font-size: 12px; color: #fff;
  }
  .wordmark { font-weight: 600; font-size: 13px; letter-spacing: .2px; }
  .account {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; cursor: pointer;
    transition: border-color .15s;
  }
  .account:hover { border-color: var(--border-strong); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 8px var(--ok); }
  .winbtns { display: flex; }
  .winbtn {
    width: 34px; height: 26px; border: 0; background: transparent;
    color: var(--text-3); font-size: 12px; border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .winbtn:hover { background: var(--raised); color: var(--text); }
  .winbtn.close:hover { background: var(--bad); color: #fff; }

  .body { padding: 4px 16px 16px; display: flex; flex-direction: column;
          gap: 12px; height: calc(100% - 46px); }

  .omni { display: flex; gap: 8px; }
  .omni input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 11px 14px;
    font-family: var(--mono); font-size: 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .omni input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(102,115,232,.18);
  }
  .omni input::placeholder { color: var(--text-3); }
  .call-btn {
    border: 0; border-radius: 10px; padding: 0 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    transition: filter .15s, transform .08s;
  }
  .call-btn:hover { filter: brightness(1.12); }
  .call-btn:active { transform: scale(.97); }

  .live {
    background: linear-gradient(160deg, rgba(102,115,232,.10), rgba(139,92,246,.05)),
                var(--panel);
    border: 1px solid rgba(102,115,232,.25);
    border-radius: 14px; padding: 14px 16px;
    animation: rise .25s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .live .top { display: flex; align-items: center; gap: 10px; }
  .live .num { font-family: var(--mono); font-size: 19px; font-weight: 600;
               letter-spacing: .5px; flex: 1; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.ring { background: rgba(245,176,77,.13); color: var(--warn);
               animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  .chip .t { font-family: var(--mono); font-weight: 400; }
  .via { color: var(--text-3); font-size: 11.5px; margin-top: 3px; }
  .controls { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
  .ctl {
    width: 38px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--raised);
    color: var(--text-2); cursor: pointer; font-size: 14px;
    transition: all .13s;
  }
  .ctl:hover { color: var(--text); border-color: var(--border-strong);
               transform: translateY(-1px); }
  .end {
    margin-left: auto; border: 0; border-radius: 8px; padding: 8px 18px;
    background: var(--bad); color: #fff; font-weight: 600; font-size: 12.5px;
    cursor: pointer; transition: filter .15s;
  }
  .end:hover { filter: brightness(1.15); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .key {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 0 6px; text-align: center; cursor: pointer;
    transition: all .12s;
  }
  .key:hover { background: var(--raised); border-color: var(--border-strong);
               transform: translateY(-1px); }
  .key:active { transform: scale(.96); background: rgba(102,115,232,.15);
                border-color: var(--accent); }
  .key .d { font-size: 16px; font-weight: 500; }
  .key .c { font-size: 8.5px; letter-spacing: 1.5px; color: var(--text-3);
            height: 11px; }

  .sect { display: flex; align-items: baseline; margin-top: 2px; }
  .sect h2 { font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
             text-transform: uppercase; color: var(--text-3); flex: 1; }
  .sect a { color: var(--accent); font-size: 12px; text-decoration: none; }

  .recents { flex: 1; overflow-y: auto; display: flex;
             flex-direction: column; gap: 4px; margin: 0 -6px; padding: 0 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    transition: background .12s;
  }
  .row:hover { background: var(--panel); }
  .row:hover .redial { opacity: 1; }
  .arrow { font-size: 12px; }
  .arrow.ok { color: var(--ok); } .arrow.bad { color: var(--bad); }
  .row .n { font-family: var(--mono); font-size: 13px; flex: 1; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 2.5px 9px;
           border-radius: 20px; }
  .badge.ok  { background: rgba(52,211,153,.12); color: var(--ok); }
  .badge.bad { background: rgba(240,101,109,.12); color: var(--bad); }
  .row .w { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .redial { opacity: 0; transition: opacity .15s; background: none;
            border: 0; color: var(--accent); cursor: pointer; font-size: 13px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 4px; }
</style>
</head>
<body>
  <div class="chrome pywebview-drag-region">
    <div class="logo">N</div>
    <div class="wordmark">NOC_Beam</div>
    <div class="account"><span class="dot"></span>Teles UK<span style="color:var(--text-3)">▾</span></div>
    <div class="winbtns">
      <button class="winbtn" id="btn-min">–</button>
      <button class="winbtn close" id="btn-close">✕</button>
    </div>
  </div>

  <div class="body">
    <div class="omni">
      <input id="num" placeholder="Type a number, paste, or press / to focus" spellcheck="false">
      <button class="call-btn">Call</button>
    </div>

    <div class="live">
      <div class="top">
        <div class="num">0035796109901</div>
        <div class="chip ring">Ringing<span class="t">00:05</span></div>
      </div>
      <div class="via">via Teles UK · AAA Tel — C207 · G729</div>
      <div class="controls">
        <button class="ctl" title="Mute">🎙</button>
        <button class="ctl" title="Hold">⏸</button>
        <button class="ctl" title="Transfer">⇄</button>
        <button class="end">End call</button>
      </div>
    </div>

    <div class="pad" id="pad"></div>

    <div class="sect"><h2>Recent calls</h2><a href="#">View all</a></div>
    <div class="recents" id="recents"></div>
  </div>

<script>
  // Static app-bundled data only; DOM built with createElement (no innerHTML).
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  const KEYS = [["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],
    ["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];
  const pad = document.getElementById("pad");
  const num = document.getElementById("num");
  for (const [d, c] of KEYS) {
    const k = el("div", "key");
    k.appendChild(el("div", "d", d));
    k.appendChild(el("div", "c", c));
    k.addEventListener("click", () => { num.value += d; });
    pad.appendChild(k);
  }

  const RECENTS = [
    ["96170010600","Answered","ok","17:06"],
    ["35796109901","Cancelled","bad","10:47"],
    ["96899406599","Not found","bad","11:48"],
    ["96170010800","Cancelled","bad","17:03"],
  ];
  const recents = document.getElementById("recents");
  for (const [n, s, k, w] of RECENTS) {
    const row = el("div", "row");
    row.appendChild(el("span", "arrow " + k, "↗"));
    row.appendChild(el("span", "n", n));
    row.appendChild(el("span", "badge " + k, s));
    row.appendChild(el("span", "w", w));
    row.appendChild(el("button", "redial", "📞"));
    recents.appendChild(row);
  }

  document.getElementById("btn-min").addEventListener("click",
    () => window.pywebview && pywebview.api.minimize());
  document.getElementById("btn-close").addEventListener("click",
    () => window.pywebview && pywebview.api.close());

  document.addEventListener("keydown", e => {
    if (e.key === "/") { e.preventDefault(); num.focus(); }
    else if (/^[0-9*#+]$/.test(e.key) && document.activeElement !== num) {
      num.focus(); num.value += e.key;
    }
  });
</script>
</body>
</html>
